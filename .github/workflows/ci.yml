name: Frontend CI/CD Pipeline

on:
  push:
    branches:
      - main
      - feat/praktikum-9

env:
  DOCKER_IMAGE_NAME: ${{ secrets.DOCKER_IMAGE_NAME_FE }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: |
            dist/
            Dockerfile
            nginx.conf
          retention-days: 1

  docker-push:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files

      - name: Login into Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker image
        run: docker build -t $DOCKER_IMAGE_NAME:$IMAGE_TAG -t $DOCKER_IMAGE_NAME:latest .

      - name: Push Docker image
        run: |
          docker push $DOCKER_IMAGE_NAME:$IMAGE_TAG
          docker push $DOCKER_IMAGE_NAME:latest

  deploy:
    runs-on: ubuntu-latest
    needs: docker-push

    steps:
      - name: Install SSH
        run: sudo apt-get update && sudo apt-get install -y ssh

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          cat > ~/.ssh/id_rsa <<'EOF'
          ${{ secrets.EC2_SSH_KEY }}
          EOF
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

          # Debug: Verify SSH key format
          echo "SSH key file size: $(wc -c < ~/.ssh/id_rsa) bytes"
          echo "SSH key first line: $(head -n 1 ~/.ssh/id_rsa)"
          echo "SSH key last line: $(tail -n 1 ~/.ssh/id_rsa)"

      - name: Deploy with Docker
        run: |
          ssh -T -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            # Stop and remove old container if exists
            docker stop ti-apap-fe 2>/dev/null || true
            docker rm ti-apap-fe 2>/dev/null || true
            
            # Pull the latest image
            docker pull ${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            
            # Run the new container
            docker run -d \
              --name ti-apap-fe \
              --restart unless-stopped \
              -p 80:80 \
              ${{ env.DOCKER_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            
            # Show container status
            docker ps -a | grep ti-apap-fe
          ENDSSH

      - name: Verify deployment
        run: |
          ssh -T -o StrictHostKeyChecking=no ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            echo "Waiting for application to start..."
            sleep 5
            
            # Check if container is running
            if docker ps | grep -q ti-apap-fe; then
              echo "✅ Container is running"
              docker logs ti-apap-fe --tail 20
              
              # Test health endpoint
              echo "Testing health endpoint..."
              curl -f http://localhost/health || echo "Health check endpoint not responding"
            else
              echo "❌ Container failed to start"
              docker logs ti-apap-fe --tail 50
              exit 1
            fi
          ENDSSH
